name: seekfeed

services:
  seekfeed:
    image: ${SEEKFEED_IMAGE:-ghcr.io/haoch1/seekfeed:latest}
    container_name: seekfeed
    restart: unless-stopped
    ports:
      - "${SEEKFEED_BIND_ADDRESS:-127.0.0.1}:${PORT:-3010}:3010"
    environment:
      NODE_ENV: production
      PORT: 3010
      HOST: 0.0.0.0
      DATABASE_PATH: /usr/src/app/data/seekfeed.db
      RSS_CHECK_ENABLED: ${RSS_CHECK_ENABLED:-true}
      RSS_TIMEOUT: ${RSS_TIMEOUT:-30000}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3010}
    volumes:
      - seekfeed_data:/usr/src/app/data
      - seekfeed_logs:/usr/src/app/logs
    stop_grace_period: 40s
    networks:
      - seekfeed_network
    healthcheck:
      test: ["CMD", "bun", "--no-install", "dist/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.50'
        reservations:
          memory: 64M
          cpus: '0.05'


volumes:
  seekfeed_data:
    name: seekfeed_data
  seekfeed_logs:
    name: seekfeed_logs

networks:
  seekfeed_network:
    name: seekfeed_network
    driver: bridge
