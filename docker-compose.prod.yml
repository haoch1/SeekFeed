name: seekfeed

services:
  seekfeed:
    image: ${SEEKFEED_IMAGE:-ghcr.io/haoch1/seekfeed:latest}
    container_name: seekfeed
    restart: unless-stopped
    ports:
      - "${SEEKFEED_BIND_ADDRESS:-127.0.0.1}:${PORT:-3010}:3010"
    environment:
      HOT_COLLECT_ENABLED: ${HOT_COLLECT_ENABLED:-true}
      HOT_BROWSER_ENDPOINT: http://seekfeed-browser:9222
      HOT_BROWSER_GUI_URL: http://seekfeed-browser:5800
      NODE_ENV: production
      PORT: 3010
      HOST: 0.0.0.0
      DATABASE_PATH: /usr/src/app/data/seekfeed.db
      RSS_CHECK_ENABLED: ${RSS_CHECK_ENABLED:-true}
      RSS_TIMEOUT: ${RSS_TIMEOUT:-30000}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3010}
    volumes:
      - seekfeed_data:/usr/src/app/data
      - seekfeed_logs:/usr/src/app/logs
    networks:
      - seekfeed_network
      - seekfeed_browser
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  seekfeed-browser:
    image: jlesage/chromium:v26.09.2@sha256:e42de7469bce122b8a69d4f62101850ece45c41ed7ed952f2b506f99947093ae
    container_name: seekfeed-browser
    restart: unless-stopped
    shm_size: 256m
    environment:
      CHROMIUM_APP_URL: https://www.nodeseek.com/
      CHROMIUM_REMOTE_DEBUGGING: '1'
      KEEP_APP_RUNNING: '1'
      DISPLAY_WIDTH: '1280'
      DISPLAY_HEIGHT: '900'
      WEB_AUDIO: '0'
      WEB_HOST_CLIPBOARD_SYNC: '0'
      WEB_FILE_MANAGER: '0'
      WEB_TERMINAL: '0'
      TZ: Asia/Shanghai
    volumes:
      - seekfeed_browser_profile:/config
    networks:
      - seekfeed_browser
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '2'
    deploy:
      resources:
        limits:
          memory: 1280M
          cpus: '0.75'

volumes:
  seekfeed_data:
    name: seekfeed_data
  seekfeed_logs:
    name: seekfeed_logs
  seekfeed_browser_profile:
    name: seekfeed_browser_profile

networks:
  seekfeed_network:
    name: seekfeed_network
    driver: bridge
  seekfeed_browser:
    name: seekfeed_browser
    driver: bridge
